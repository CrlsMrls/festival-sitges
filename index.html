<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Agenda del Festival de Sitges 2026">
  <meta name="theme-color" content="#FF0042">
  <title>Festival de Sitges 2026</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="Sitges_Film_Festival.png">
  <link rel="icon" type="image/png" href="Sitges_Film_Festival.png">

  <!-- Styles: a local, pre-built stylesheet instead of the Tailwind CDN
       script. The CDN script generated these same utility classes at
       runtime by scanning the DOM, but it was also listed in the Service
       Worker's install-time cache.addAll() — and since that call is
       all-or-nothing, any hiccup fetching that external script meant the
       ENTIRE offline cache silently failed to install, including
       index.html/app.js/movies.json. Serving the CSS as a same-origin file
       removes that single point of failure for "sin internet" to work. -->
  <link rel="stylesheet" href="styles.css">
</head>

<body class="min-h-screen bg-gray-950 text-white">

  <!-- Header -->
  <div id="header" class="bg-black/95 backdrop-blur-xl border-b border-sitges-red/50 shadow-xl shadow-sitges-red/20">
    <div class="max-w-4xl mx-auto px-4 py-5">
      <h1
        class="text-3xl font-black text-center bg-gradient-to-r from-sitges-red via-sitges-pink to-sitges-blue bg-clip-text text-transparent drop-shadow-lg">
        🎬 Festival Sitges <span id="header-year">2026</span>
      </h1>
      <p id="movie-count" class="text-center text-sm text-gray-400 mt-2 font-medium"></p>
    </div>

    <!-- Now / Next banner: what's on and what's coming up, live -->
    <div id="now-next-banner"
      class="hidden max-w-4xl mx-auto px-4 py-3 mb-1 bg-black/60 border-t border-sitges-red/20"></div>
  </div>

  <!-- Sessions Container. The loading state below is plain HTML already in
       the page (not injected by JS), so it shows instantly — including the
       few seconds it can take to time out and fall back when there's no
       connection. renderSessions() always clears this container before
       drawing the real cards, so it disappears on its own once data is
       ready; no extra JS needed to hide it. -->
  <div id="sessions-container" class="max-w-4xl mx-auto px-4 py-6 space-y-8 pb-6">
    <div class="flex flex-col items-center justify-center gap-4 py-20 text-gray-400">
      <div class="spinner"></div>
      <p class="text-sm">Cargando programación…</p>
    </div>
  </div>

  <!-- PWA Install Button (Bottom - Always Visible) -->
  <div class="max-w-4xl mx-auto px-4 pb-6">
    <button id="pwa-install-btn"
      class="w-full py-3 px-4 bg-gradient-to-r from-sitges-red to-sitges-pink text-white text-sm font-semibold rounded-lg shadow-lg border border-sitges-red/50 transition-all flex items-center justify-center gap-2">
      💾 Añadir a inicio
    </button>
  </div>

  <!-- Year switcher — filled in by app.js (renderYearSwitcher), always the
       very last thing on the page. -->
  <div id="year-switcher" class="max-w-4xl mx-auto px-4 pb-10 flex flex-col items-center"></div>

  <script src="app.js"></script>
  <script>
    // Service Worker Registration with mobile alerts
    if ('serviceWorker' in navigator) {
      debug('SW: controller at load', { hasController: !!navigator.serviceWorker.controller });
      navigator.serviceWorker.register('sw.js')
        .then(reg => {
          debug('SW: registered', { scope: reg.scope, active: !!reg.active, waiting: !!reg.waiting, installing: !!reg.installing });

          // Check for updates
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            debug('SW: update found');

            newWorker.addEventListener('statechange', () => {
              debug('SW: new worker state', newWorker.state);
            });
          });
        })
        .catch(err => {
          debug('SW: registration FAILED', String(err));
          alert('⚠️ Error al registrar Service Worker:\n' + err.message);
        });

      // Handle controller change
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        debug('SW: controller changed');
      });
    } else {
      debug('SW: not supported by this browser');
      alert('⚠️ Tu navegador no soporta Service Workers. La app no funcionará offline.');
    }

    // Global error handler for mobile debugging
    window.addEventListener('error', (event) => {
      console.error('Global error:', event.error);
      alert('❌ Error:\n' + event.error.message + '\n\nArchivo: ' + event.filename + '\nLínea: ' + event.lineno);
    });

    // Unhandled promise rejections
    window.addEventListener('unhandledrejection', (event) => {
      console.error('Unhandled rejection:', event.reason);
      alert('❌ Promise Error:\n' + event.reason);
    });
  </script>
</body>

</html>
